name: ScopeGuard Risk Analysis

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      risk_threshold:
        description: 'Risk score threshold (0-100). Pipeline fails if exceeded.'
        required: false
        default: '75'
        type: string

env:
  SCOPEGUARD_RISK_THRESHOLD: ${{ github.event.inputs.risk_threshold || '75' }}

jobs:
  scopeguard-analysis:
    name: ScopeGuard Risk Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need parent commit for diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run ScopeGuard risk analysis
        id: risk
        run: |
          cd backend
          python -m app.cli.main risk "$GITHUB_WORKSPACE" \
            --commit HEAD \
            --threshold $SCOPEGUARD_RISK_THRESHOLD \
            --json > ../scopeguard-report.json || EXIT_CODE=$?

          echo "exit_code=${EXIT_CODE:-0}" >> $GITHUB_OUTPUT

          # Display human-readable summary
          python -m app.cli.main risk "$GITHUB_WORKSPACE" --commit HEAD

          # Exit with the original code
          exit ${EXIT_CODE:-0}

      - name: Run ScopeGuard test impact
        if: always()
        run: |
          cd backend
          python -m app.cli.main tests "$GITHUB_WORKSPACE" --commit HEAD

      - name: Upload analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scopeguard-report
          path: scopeguard-report.json
          retention-days: 30
